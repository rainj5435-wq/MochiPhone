async function callAI(api,persona,hist){
 const base=api.url.replace(/\/$/,'');const claude=api.tpl==='claude'||/anthropic\.com/.test(base);
 const sys='你在手机聊天软件里和用户聊天，保持角色，用自然口语化的简短中文回复。'+(persona?'角色设定：'+persona:'');
 const ms=[];hist.slice(-24).forEach(m=>{const role=m.me?'user':'assistant';if(ms.length&&ms[ms.length-1].role===role)ms[ms.length-1].content+='\n'+m.text;else ms.push({role,content:m.text});});
 while(ms.length&&ms[0].role!=='user')ms.shift();
 const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),60000);
 try{
  const url=claude?(/\/v1$/.test(base)?base:base+'/v1')+'/messages':base+'/chat/completions';
  const r=await fetch(url,{method:'POST',signal:ctl.signal,
   headers:claude?{'Content-Type':'application/json','x-api-key':api.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'}:{'Content-Type':'application/json','Authorization':'Bearer '+api.key},
   body:JSON.stringify(claude?{model:api.model,max_tokens:1024,system:sys,messages:ms}:{model:api.model,messages:[{role:'system',content:sys},...ms]})});
  if(!r.ok){const t=await r.text().catch(()=>'');const m={401:'Key 无效或已过期',403:'没有权限，检查 Key 或地区限制',404:'地址或模型不存在',429:'请求太频繁或额度用完'}[r.status];throw new Error((m||'请求失败 '+r.status)+(m?'':(t?'：'+t.slice(0,80):'')));}
  const j=await r.json();const out=claude?(j.content||[]).map(c=>c.text||'').join(''):(j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content);
  if(!out)throw new Error('接口返回为空');return out.trim();
 }catch(e){if(e.name==='AbortError')throw new Error('请求超时');if(e instanceof TypeError)throw new Error('网络错误或被跨域拦截，该服务商可能不允许浏览器直接调用，可换成中转地址');throw e;}
 finally{clearTimeout(to);}
}

            h('span',{style:{fontSize:'11px',fontWeight:500,color:wp.light?'rgba(0,0,0,.6)':'rgba(255,255,255,.7)'}},wp.name)))))));

function PassPage({s,upd,onBack}){
  const [cur,setCur]=useState('');const [n1,setN1]=useState('');const [n2,setN2]=useState('');const [msg,setMsg]=useState('');
  const save=()=>{
    if(s.passOn&&cur!==s.pass){setMsg('当前密码错误');return;}
    if(!/^\d{4}$/.test(n1)){setMsg('新密码须为 4 位数字');return;}
    if(n1!==n2){setMsg('两次输入不一致');return;}
    upd({pass:n1,passOn:true});setMsg('密码已更新');setCur('');setN1('');setN2('');};
  const ii=(v,set,ph)=>h('input',{value:v,onChange:e=>set(e.target.value.replace(/\D/g,'').slice(0,4)),placeholder:ph,type:'password',inputMode:'numeric',style:{width:'100%',background:'var(--ibg)',border:'1px solid var(--border2)',borderRadius:'10px',padding:'10px 14px',color:'var(--text)',fontSize:'15px',outline:'none',textAlign:'center',marginBottom:'10px'}});
  return h('div',{style:{display:'flex',flexDirection:'column',height:'100%',background:'var(--bg)'}},
    h(BH,{title:'锁屏密码',onBack}),
    h('div',{style:{flex:1,overflowY:'auto',padding:'12px 16px 20px'}},
      h(Sec,{title:'开关'},h(SRow,{label:'启用密码',sub:'关闭后上滑即可解锁',toggle:true,tv:s.passOn,onT:v=>upd({passOn:v}),last:true})),
      h(Sec,{title:s.passOn?'修改密码':'设置密码'},h('div',{style:{padding:'14px 16px'}},
        s.passOn&&ii(cur,setCur,'当前密码'),ii(n1,setN1,'新密码（4 位数字）'),ii(n2,setN2,'再输入一次'),
        msg&&h('div',{style:{fontSize:'13px',color:msg.includes('更新')?'#34c759':'#ff453a',marginBottom:'8px',textAlign:'center'}},msg),
        h('button',{onClick:save,style:{width:'100%',padding:'11px',borderRadius:'10px',background:'var(--text)',color:'var(--bg)',fontSize:'14px',fontWeight:600,border:'none',cursor:'pointer'}},'保存'))),
      h('div',{style:{fontSize:'12px',color:'var(--text3)',lineHeight:1.7,padding:'8px 6px'}},'默认密码 1111。忘记密码：在网址末尾加上 ?resetpass 打开一次，即可重置为 1111，聊天记录不会丢。')));
}

function PersonalPg({s,upd,onBack}){
  const [msg,setMsg]=useState('');const [ld,setLd]=useState(false);
  const hf=()=>pickFile('.ttf,.otf,.woff,.woff2',async f=>{setLd(true);setMsg('');try{await fset(await f.arrayBuffer());const ok=await applyFont();if(ok){upd({hasFont:true});setMsg('字体已应用 ✓');}else setMsg('加载失败，请换个文件');}catch(e){setMsg('导入出错');}setLd(false);});

  const lab=t=>h('div',{style:{fontSize:'13px',color:'var(--text2)',marginBottom:'8px'}},t);
  return h('div',{style:{display:'flex',flexDirection:'column',height:'100%',background:'var(--bg)'}},
    h(BH,{title:'个性化',onBack}),
    h('div',{style:{flex:1,overflowY:'auto',padding:'10px 16px 20px'}},
      h(Sec,{title:'字体'},h('div',{style:{padding:'12px 16px',display:'flex',flexDirection:'column',gap:'10px'}},
        h('div',{style:{fontSize:'13px',color:'var(--text2)'}},s.hasFont?'已使用自定义字体':'支持 .ttf / .otf，导入后全局立即生效'),
        h('div',{style:{display:'flex',gap:'8px'}},
          h('div',{onClick:hf,style:{flex:1,padding:'9px',borderRadius:'10px',border:'1.5px dashed var(--border2)',textAlign:'center',cursor:'pointer',color:'var(--text2)',fontSize:'14px'}},ld?'导入中...':'导入字体文件'),
          s.hasFont&&h('div',{onClick:clr,style:{padding:'9px 12px',borderRadius:'10px',border:'1.5px solid var(--border2)',cursor:'pointer',color:'var(--text3)',fontSize:'14px'}},'恢复默认')),
        msg&&h('div',{style:{fontSize:'12px',color:msg.includes('✓')?'#34c759':'var(--text3)'}},msg))),
      h(Sec,{title:'图标'},h('div',{style:{padding:'12px 16px',display:'flex',flexDirection:'column',gap:'12px'}},
        h('div',null,lab('图标大小'),h(Seg,{opts:[{id:'small',l:'小'},{id:'normal',l:'标准'},{id:'large',l:'大'}],val:s.iconSz,onV:v=>upd({iconSz:v})})),
        h(SRow,{label:'显示图标名称',toggle:true,tv:s.showLbl,onT:v=>upd({showLbl:v}),last:true}))),
      h(Sec,{title:'Dock'},h('div',{style:{padding:'12px 16px'}},h(Seg,{opts:[{id:'glass',l:'毛玻璃'},{id:'solid',l:'纯色'},{id:'none',l:'透明'}],val:s.dockSt,onV:v=>upd({dockSt:v})}))),
      h(Sec,{title:'锁屏时钟'},h('div',{style:{padding:'12px 16px',display:'flex',flexDirection:'column',gap:'12px'}},
        h('div',null,lab('字重'),h(Seg,{opts:[{id:'thin',l:'细体'},{id:'medium',l:'中等'},{id:'bold',l:'粗体'}],val:s.ckW,onV:v=>upd({ckW:v})})),
        h('div',null,lab('大小'),h(Seg,{opts:[{id:'small',l:'小'},{id:'medium',l:'中'},{id:'large',l:'大'}],val:s.ckSz,onV:v=>upd({ckSz:v})}))))));
}

  const opts=[{id:'dark',label:'深色',desc:'深色背景，沉静克制'},{id:'light',label:'浅色',desc:'浅色背景，干净清爽'},{id:'auto',label:'跟随系统',desc:'随手机主题自动切换'}];
  return h('div',{style:{display:'flex',flexDirection:'column',height:'100%',background:'var(--bg)'}},
    h(BH,{title:'外观',onBack}),
    h('div',{style:{flex:1,padding:'12px 16px',display:'flex',flexDirection:'column',gap:'8px'}},
      ...opts.map(o=>h('div',{key:o.id,onClick:()=>onSel(o.id),style:{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'14px 16px',borderRadius:'13px',cursor:'pointer',background:cur===o.id?'var(--card2)':'var(--card)',border:cur===o.id?'1.5px solid var(--border2)':'1.5px solid var(--border)'}},
        h('div',null,h('div',{style:{color:'var(--text)',fontSize:'15px',fontWeight:500}},o.label),h('div',{style:{color:'var(--text3)',fontSize:'12px',marginTop:'2px'}},o.desc)),
        cur===o.id&&h('div',{style:{width:'18px',height:'18px',borderRadius:'50%',border:'2px solid var(--text)',display:'flex',alignItems:'center',justifyContent:'center'}},h('div',{style:{width:'8px',height:'8px',borderRadius:'50%',background:'var(--text)'}}))))));
}

function SettingsApp({s,upd}){
  const [sub,setSub]=useState(null);
  const back=()=>setSub(null);
  if(sub==='wp')return h(WPPage,{s,upd,onBack:back});
  if(sub==='theme')return h(ThemePg,{cur:s.theme,onSel:t=>{upd({theme:t});back();},onBack:back});
  if(sub==='personal')return h(PersonalPg,{s,upd,onBack:back});
  if(sub==='api')return h(APIPage,{s,upd,onBack:back});
  if(sub==='pass')return h(PassPage,{s,upd,onBack:back});
  if(sub==='about')return h('div',{style:{display:'flex',flexDirection:'column',height:'100%',background:'var(--bg)'}},
    h(BH,{title:'关于',onBack:back}),
    h('div',{style:{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:'18px',padding:'32px'}},
      h('div',{style:{width:'72px',height:'72px',borderRadius:'22px',background:SQ,display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'0 4px 16px var(--shad)'}},h(Gl,{id:'chat',size:36})),
      h('div',{style:{fontSize:'22px',fontWeight:700,color:'var(--text)'}},'萌萌机'),
      h(Card,{style:{width:'100%'}},...[['版本','0.5 测试版'],['作者','rainj5435-wq'],['框架','React 18 · PWA']].map(([k,v],i,a)=>h('div',{key:k,style:{display:'flex',justifyContent:'space-between',padding:'11px 16px',borderBottom:i<a.length-1?'1px solid var(--div)':'none'}},h('span',{style:{color:'var(--text3)',fontSize:'14px'}},k),h('span',{style:{color:'var(--text)',fontSize:'14px',fontWeight:500}},v)))),
      h('div',{style:{color:'var(--text3)',fontSize:'12px',textAlign:'center',lineHeight:1.8}},'你的 AI 小手机，持续开发中')));
  const ic=n=>h(Ic,{n,size:16});
  const tl={dark:'深色',light:'浅色',auto:'跟随系统'}[s.theme];
  const wl=s.cwp?'自定义':(WPS[s.wp]||WPS[0]).name;
  const na=(s.apis||[]).length;
  return h('div',{style:{display:'flex',flexDirection:'column',height:'100%',background:'var(--bg)'}},
    h('div',{style:{padding:'18px 20px 10px',flexShrink:0,borderBottom:'1px solid var(--div)'}},h('h1',{style:{fontSize:'22px',fontWeight:700,color:'var(--text)',letterSpacing:'-.5px'}},'设置')),
    h('div',{style:{flex:1,overflowY:'auto',padding:'8px 16px 20px'}},
      h(Sec,{title:'外观'},
        h(SRow,{icon:ic('theme'),color:'#636366',label:'外观',value:tl,onPress:()=>setSub('theme')}),
        h(SRow,{icon:ic('image'),color:'#48484a',label:'壁纸',value:wl,onPress:()=>setSub('wp')}),
        h(SRow,{icon:ic('sparkle'),color:'#3a3a3c',label:'个性化',sub:'字体 · 图标 · 时钟',onPress:()=>setSub('personal'),last:true})),
      h(Sec,{title:'AI'},h(SRow,{icon:ic('chip'),color:'#3a3a3c',label:'AI API',sub:na?na+' 个已配置':'未配置，点此添加',onPress:()=>setSub('api'),last:true})),
      h(Sec,{title:'安全'},h(SRow,{icon:ic('lock'),color:'#48484a',label:'锁屏密码',sub:s.passOn?'已启用':'未启用',onPress:()=>setSub('pass'),last:true})),
      h(Sec,{title:'通知与声音'},
        h(SRow,{icon:ic('bell'),color:'#636366',label:'通知',toggle:true,tv:s.notif,onT:v=>upd({notif:v})}),
        h(SRow,{icon:ic('volume'),color:'#48484a',label:'声音',toggle:true,tv:s.sound,onT:v=>upd({sound:v})}),
        h(SRow,{icon:ic('moon'),color:'#3a3a3c',label:'勿扰',toggle:true,tv:s.dnd,onT:v=>upd({dnd:v}),last:true})),
      h(Sec,{title:'其他'},h(SRow,{icon:ic('info'),color:'#48484a',label:'关于萌萌机',value:'0.5',onPress:()=>setSub('about'),last:true}))));
}

function Soon({app}){
  return h('div',{style:{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',height:'100%',gap:'14px',padding:'40px',background:'var(--bg)'}},
    h('div',{style:{width:'68px',height:'68px',borderRadius:'21px',background:SQ,display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'0 4px 16px var(--shad)'}},h(Gl,{id:app.id,size:32})),
    h('div',{style:{fontSize:'19px',fontWeight:600,color:'var(--text)',letterSpacing:'-.3px'}},app.name),
    h('div',{style:{background:'var(--card)',border:'1px solid var(--border)',borderRadius:'12px',padding:'11px 20px',color:'var(--text3)',fontSize:'14px'}},'此 App 即将开放'));
}

function AppWin({app,s,upd,onClose}){
  const [vis,setVis]=useState(false);
  useEffect(()=>{const t=setTimeout(()=>setVis(true),10);return()=>clearTimeout(t);},[]);
  const close=()=>{setVis(false);setTimeout(onClose,250);};
  const wp=s.cwp?{css:`url(${s.cwp}) center/cover`,light:!!s.cwpLight}:(WPS[s.wp]||WPS[0]);
  const body=app.id==='settings'?h(SettingsApp,{s,upd}):app.id==='chat'?h(ChatApp,{s,onUpdate:upd}):h(Soon,{app});
  return h('div',{style:{position:'absolute',inset:0,zIndex:5,display:'flex',flexDirection:'column',transform:vis?'scale(1)':'scale(.95)',opacity:vis?1:0,transformOrigin:'center bottom',transition:'transform .24s cubic-bezier(.34,1.1,.64,1),opacity .2s',overflow:'hidden',borderRadius:'inherit',background:'var(--bg)'}},
    h('div',{style:{flexShrink:0,background:'var(--hbg)',backdropFilter:'blur(20px)',WebkitBackdropFilter:'blur(20px)',borderBottom:'1px solid var(--div)',color:'var(--text)'}},
      h(StatusBar,{wp:{light:document.documentElement.getAttribute('data-theme')==='light'}}),
      h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'2px 16px 10px'}},
        h('span',{style:{fontSize:'17px',fontWeight:600,color:'var(--text)',letterSpacing:'-.3px'}},app.name),
        h('button',{onClick:close,style:{background:'var(--card2)',border:'1px solid var(--border)',borderRadius:'50%',width:'26px',height:'26px',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',color:'var(--text3)',flexShrink:0}},h(Ic,{n:'close',size:13,sw:2})))),
    h('div',{style:{flex:1,overflow:'hidden',position:'relative'}},body),
    h('div',{style:{padding:'7px 0 5px',display:'flex',justifyContent:'center',flexShrink:0,background:'var(--hbg)'}},h('div',{onClick:close,style:{width:'100px',height:'4px',background:'var(--text3)',borderRadius:'2px',cursor:'pointer'}})));
}

function PWABar(){
  const [show,setShow]=useState(false);
  useEffect(()=>{const t=setTimeout(()=>{if(installEvt)setShow(true);},1500);return()=>clearTimeout(t);},[]);
  if(!show)return null;
  const install=async()=>{if(!installEvt)return;installEvt.prompt();try{await installEvt.userChoice;}catch(e){}installEvt=null;setShow(false);};
  return h('div',{style:{position:'absolute',bottom:'100px',left:'12px',right:'12px',zIndex:8,background:'var(--hbg)',backdropFilter:'blur(20px)',WebkitBackdropFilter:'blur(20px)',border:'1px solid var(--border2)',borderRadius:'16px',padding:'12px 14px',display:'flex',alignItems:'center',gap:'12px',boxShadow:'0 4px 20px var(--shad)',color:'var(--text)'}},
    h(Ic,{n:'download',size:24,sw:1.6}),
    h('div',{style:{flex:1}},h('div',{style:{fontSize:'14px',fontWeight:600}},'安装萌萌机'),h('div',{style:{fontSize:'12px',color:'var(--text3)',marginTop:'2px'}},'添加到桌面，像 App 一样使用')),
    h('button',{onClick:install,style:{padding:'7px 14px',borderRadius:'10px',background:'var(--text)',color:'var(--bg)',fontSize:'13px',fontWeight:600,border:'none',cursor:'pointer'}},'安装'),
    h('button',{onClick:()=>setShow(false),style:{background:'none',border:'none',color:'var(--text3)',cursor:'pointer',padding:'4px',display:'flex'}},h(Ic,{n:'close',size:16,sw:2})));
}

function PhoneShell(){
  const [s,setS]=useState(getS);
  const [locked,setLocked]=useState(true);
  const [aid,setAid]=useState(null);
  const upd=useCallback(p=>setS(prev=>{const n={...prev,...(typeof p==='function'?p(prev):p)};LS.s(n);return n;}),[]);
  useEffect(()=>{if(s.hasFont)applyFont();},[]);
  useEffect(()=>{applyTheme(s.theme);},[s.theme]);
  const wp=useMemo(()=>s.cwp?{css:`url(${s.cwp}) center/cover no-repeat`,light:!!s.cwpLight}:(WPS[s.wp]||WPS[0]),[s.wp,s.cwp,s.cwpLight]);
  const app=aid?APPS.find(a=>a.id===aid):null;
  return h('div',{style:{width:'100%',height:'100%',position:'relative',borderRadius:'inherit',overflow:'hidden'}},
    h(HomeScreen,{onOpen:setAid,visible:!app,wp,s}),
    !locked&&!app&&h(PWABar),
    app&&h(AppWin,{key:app.id,app,s,upd,onClose:()=>setAid(null)}),
    locked&&h(LockScreen,{wp,s,onUnlock:()=>setLocked(false)}));
}

function App(){return h('div',{style:{minHeight:'100dvh',display:'flex',alignItems:'center',justifyContent:'center',background:'#000'}},h('div',{className:'po'},h(PhoneShell)));}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
