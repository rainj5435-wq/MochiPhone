<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>萌萌机</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:#000;font-family:var(--mf);}
::-webkit-scrollbar{display:none}
#root{width:100vw;height:100dvh;display:flex;align-items:center;justify-content:center;overflow:hidden}
:root{
  --mf:-apple-system,'SF Pro Display','Helvetica Neue',sans-serif;
  --bg:#0f0f0f;--bg2:#1a1a1a;--bg3:#222;
  --card:rgba(255,255,255,0.055);--card2:rgba(255,255,255,0.09);--card3:rgba(255,255,255,0.13);
  --border:rgba(255,255,255,0.09);--border2:rgba(255,255,255,0.15);
  --text:#f0f0f0;--text2:rgba(255,255,255,0.58);--text3:rgba(255,255,255,0.28);
  --toggle:#555;--dock:rgba(20,20,20,0.78);
  --sc:#f0f0f0;--hbg:rgba(15,15,15,0.92);
  --div:rgba(255,255,255,0.07);--shad:rgba(0,0,0,0.6);
  --ibg:rgba(255,255,255,0.07);
  --bme:#1c1c1e;--bthem:rgba(255,255,255,0.1);
  --bmet:#fff;--bthemt:#f0f0f0;
}
[data-theme="light"]{
  --bg:#f2f2f7;--bg2:#fff;--bg3:#e8e8ed;
  --card:rgba(0,0,0,0.038);--card2:rgba(0,0,0,0.065);--card3:rgba(0,0,0,0.095);
  --border:rgba(0,0,0,0.07);--border2:rgba(0,0,0,0.12);
  --text:#111;--text2:rgba(0,0,0,0.5);--text3:rgba(0,0,0,0.28);
  --toggle:#888;--dock:rgba(210,210,215,0.82);
  --sc:#111;--hbg:rgba(242,242,247,0.94);
  --div:rgba(0,0,0,0.065);--shad:rgba(0,0,0,0.1);
  --ibg:rgba(0,0,0,0.05);
  --bme:#1c1c1e;--bthem:rgba(0,0,0,0.07);
  --bmet:#fff;--bthemt:#111;
}
@media(min-width:520px){
  .po{width:390px!important;height:844px!important;border-radius:52px!important;
  box-shadow:0 0 0 9px #181818,0 0 0 11px #252525,0 40px 100px rgba(0,0,0,.85)!important;}
}
.po{width:100vw;height:100dvh;border-radius:0;overflow:hidden;position:relative;background:var(--bg);font-family:var(--mf);}
</style>
</head>
<body><div id="root"></div>
<script>
const {useState,useEffect,useCallback,useRef,useMemo}=React;
const h=React.createElement;

const WPS=[
  {name:'墨夜',css:'#0a0a0a',light:false},
  {name:'霜白',css:'linear-gradient(160deg,#e0e0e0,#f5f5f5)',light:true},
  {name:'玄铁',css:'linear-gradient(145deg,#0e0e0e,#252525)',light:false},
  {name:'银雾',css:'linear-gradient(160deg,#c8c8c8,#e5e5e5)',light:true},
  {name:'深空',css:'radial-gradient(ellipse at 30% 20%,#181818,#060606)',light:false},
  {name:'月光',css:'radial-gradient(ellipse at 50% 30%,#e8e8e8,#c0c0c0)',light:true},
  {name:'炭灰',css:'linear-gradient(180deg,#0a0a0a,#1a1a1a)',light:false},
  {name:'晨雾',css:'linear-gradient(160deg,#d8d8d8,#efefef)',light:true},
];

const APPS=[
  {id:'chat',    name:'聊天',   svg:'M8 2C4.7 2 2 4.3 2 7.2c0 1.6.7 3 1.9 4L3 14l3.1-1.4C7 13 7.5 13.1 8 13.1c3.3 0 6-2.3 6-5.1S11.3 2 8 2z'},
  {id:'memory',  name:'记忆',   svg:'M9 2a4 4 0 0 1 4 4c0 1-.3 1.9-.9 2.6L14 14h-3v-2H9v-2H7l-.1-.1A4 4 0 0 1 9 2z'},
  {id:'photos',  name:'相册',   svg:'M3 5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5zm3 1a1.5 1.5 0 1 0 3 0 1.5 1.5 0 0 0-3 0zm2 7 2.5-3.5L13 13H6z'},
  {id:'music',   name:'音乐',   svg:'M9 3v8.4A3 3 0 1 1 7 9V5l6-1.5V7a3 3 0 1 1-2-2.8V4L9 5V3z'},
  {id:'pet',     name:'宠物',   svg:'M4.5 9a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zm7 0a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zM8 15c-2.5 0-4.5-1.3-5-3 .5-1 1.8-1.5 3-1 .5.2 1.3.4 2 .4s1.5-.2 2-.4c1.2-.5 2.5 0 3 1-.5 1.7-2.5 3-5 3z'},
  {id:'shop',    name:'商店',   svg:'M3 3h2l.4 2M7 13h8l2-8H5.4M7 13 5.4 5M7 13l-1 2h9M9 17a1 1 0 1 0 2 0 1 1 0 0 0-2 0zm6 0a1 1 0 1 0 2 0 1 1 0 0 0-2 0z'},
  {id:'wallet',  name:'钱包',   svg:'M3 6a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v1H3V6zm0 3h14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9zm11 2a1 1 0 1 0 2 0 1 1 0 0 0-2 0z'},
  {id:'calendar',name:'日历',   svg:'M5 3v2M11 3v2M3 9h10M5 5h8a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2zm2 6h2v2H7z'},
  {id:'diary',   name:'日记',   svg:'M6 2h7l3 3v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1zm2 9H6v2h2v-2zm0-4H6v2h2V7zm4 4h-2v2h2v-2zm0-4h-2v2h2V7z'},
  {id:'social',  name:'社交',   svg:'M15 8c0 2.8-3 5-7 5a8 8 0 0 1-2-.3L3 14l.7-2.5A5 5 0 0 1 2 8c0-2.8 3-5 7-5s6 2.2 6 5z'},
  {id:'browser', name:'浏览器', svg:'M8 2a6 6 0 1 1 0 12A6 6 0 0 1 8 2zm0 1.5c-.7 0-1.8 1-2.3 2.5h4.6C9.8 4.5 8.7 3.5 8 3.5zm-3 2.5A7 7 0 0 0 4.5 8c0 .7.1 1.4.3 2h6.4c.2-.6.3-1.3.3-2s-.1-1.4-.3-2H5zm.5 4.5c.5 1.5 1.6 2.5 2.3 2.5s1.8-1 2.3-2.5H5.7z'},
  {id:'studio',  name:'画室',   svg:'M2 12l5-5 3 3 4-6 4 8H2z'},
  {id:'settings',name:'设置',   svg:'M8 5a3 3 0 1 0 0 6 3 3 0 0 0 0-6zm5.7 2.5-.8-.1a5 5 0 0 0-.4-1l.5-.7-1.4-1.4-.7.5a5 5 0 0 0-1-.4l-.1-.8H8.2l-.1.8a5 5 0 0 0-1 .4l-.7-.5L5 5.7l.5.7a5 5 0 0 0-.4 1l-.8.1v2l.8.1a5 5 0 0 0 .4 1l-.5.7 1.4 1.4.7-.5a5 5 0 0 0 1 .4l.1.8h1.6l.1-.8a5 5 0 0 0 1-.4l.7.5 1.4-1.4-.5-.7a5 5 0 0 0 .4-1l.8-.1v-2z'},
];
const DOCK_IDS=['chat','browser','music','settings'];
const GRID=APPS.filter(a=>!DOCK_IDS.includes(a.id));
const P1=GRID.slice(0,9),P2=GRID.slice(9);

const dbOpen=name=>new Promise((r,j)=>{const q=indexedDB.open(name,1);q.onupgradeneeded=e=>e.target.result.createObjectStore('s');q.onsuccess=e=>r(e.target.result);q.onerror=j;});
const dbGet=async(db,k)=>new Promise(r=>{const t=db.transaction('s','readonly');const q=t.objectStore('s').get(k);q.onsuccess=e=>r(e.target.result??null);q.onerror=()=>r(null);});
const dbSet=async(db,k,v)=>new Promise((r,j)=>{const t=db.transaction('s','readwrite');t.objectStore('s').put(v,k);t.oncomplete=r;t.onerror=j;});
const dbDel=async(db,k)=>new Promise(r=>{const t=db.transaction('s','readwrite');t.objectStore('s').delete(k);t.oncomplete=r;});
let _fdb=null;
const getFDB=async()=>{if(!_fdb)_fdb=await dbOpen('mochi_assets');return _fdb;};
async function applyFont(){
  const db=await getFDB();const buf=await dbGet(db,'font');if(!buf)return false;
  try{const f=new FontFace('MF',buf);await f.load();document.fonts.add(f);document.documentElement.style.setProperty('--mf','"MF",-apple-system,sans-serif');return true;}catch{return false;}
}

const DEF={wp:0,cwp:null,theme:'dark',notif:true,sound:true,dnd:false,iconSz:'normal',showLbl:true,ckW:'bold',ckSz:'large',dockSt:'glass',hasFont:false,chatBg:null,bubbleFrost:false,showTime:true,avatarRound:50,apis:[],defaultApi:null,contacts:[{id:'ai1',name:'助手',avatar:'🤖',bio:'你好，我是萌萌机内置助手',online:true}],chats:{}};
const LS={g(){try{const s=localStorage.getItem('mv4');return s?JSON.parse(s):{};}catch{return{};}},s(v){try{localStorage.setItem('mv4',JSON.stringify(v));}catch{}}};
const getS=()=>({...DEF,...LS.g()});
const pad=n=>String(n).padStart(2,'0');
const rt=t=>t==='auto'?window.matchMedia('(prefers-color-scheme:light)').matches?'light':'dark':t;
const applyTheme=t=>document.querySelector('.po')?.setAttribute('data-theme',rt(t));

function StatusBar({battery,wp}){
  const [now,setNow]=useState(new Date());
  useEffect(()=>{const t=setInterval(()=>setNow(new Date()),1000);return()=>clearInterval(t);},[]);
  const c=wp?.light?'#111':'var(--sc)';
  return h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'14px 22px 2px',flexShrink:0,userSelect:'none',color:c,fontFamily:'var(--mf)'}},
    h('span',{style:{fontSize:'16px',fontWeight:700,letterSpacing:'-0.5px'}},`${pad(now.getHours())}:${pad(now.getMinutes())}`),
    h('div',{style:{display:'flex',alignItems:'center',gap:'7px'}},
      h('div',{style:{display:'flex',gap:'2.5px',alignItems:'center'}},
        ...[1,1,1,1,0.3,0.3].map((o,i)=>h('div',{key:i,style:{width:'3.5px',height:'3.5px',borderRadius:'50%',background:c,opacity:o}}))
      ),
      h('svg',{width:16,height:12,viewBox:'0 0 16 12',fill:'none'},
        h('path',{d:'M8 10a1 1 0 1 1 0 2 1 1 0 0 1 0-2z',fill:c}),
        h('path',{d:'M4.9 7.5a4.5 4.5 0 0 1 6.2 0',stroke:c,strokeWidth:'1.5',strokeLinecap:'round',fill:'none'}),
        h('path',{d:'M2 4.8a8 8 0 0 1 12 0',stroke:c,strokeWidth:'1.5',strokeLinecap:'round',fill:'none',opacity:.38})
      ),
      h('div',{style:{display:'flex',alignItems:'center',gap:'3px'}},
        h('span',{style:{fontSize:'13px',fontWeight:600,opacity:.88}},battery+'%'),
        h('div',{style:{display:'flex',alignItems:'center',gap:'1px'}},
          h('div',{style:{width:'22px',height:'11px',border:`1.5px solid ${c}`,borderRadius:'3px',padding:'1.5px',display:'flex',alignItems:'center'}},
            h('div',{style:{width:Math.max(3,battery*.18)+'px',height:'100%',background:battery<20?'#ff3b30':c,borderRadius:'1px'}})
          ),
          h('div',{style:{width:'2px',height:'5px',background:c,borderRadius:'0 1px 1px 0',opacity:.4}})
        )
      )
    )
  );
}

function LockScreen({battery,wp,s,onUnlock}){
  const [now,setNow]=useState(new Date());
  const [out,setOut]=useState(false);
  const [dy,setDy]=useState(0);
  const sy=useRef(0);
  useEffect(()=>{const t=setInterval(()=>setNow(new Date()),1000);return()=>clearInterval(t);},[]);
  const days=['周日','周一','周二','周三','周四','周五','周六'];
  const il=wp?.light;
  const tc=il?'rgba(0,0,0,0.88)':'#fff';
  const tc2=il?'rgba(0,0,0,0.42)':'rgba(255,255,255,0.48)';
  const cw=s.ckW==='thin'?200:s.ckW==='medium'?400:700;
  const csz=s.ckSz==='small'?68:s.ckSz==='medium'?80:90;
  const doU=()=>{if(out)return;setOut(true);setTimeout(onUnlock,280);};
  return h('div',{onClick:doU,onTouchStart:e=>{sy.current=e.touches[0].clientY;},onTouchMove:e=>{const d=sy.current-e.touches[0].clientY;if(d>0)setDy(d);},onTouchEnd:()=>{if(dy>48)doU();else setDy(0);},
    style:{position:'absolute',inset:0,display:'flex',flexDirection:'column',cursor:'pointer',userSelect:'none',background:wp?.css||'#0a0a0a',opacity:out?0:1,transform:out?'scale(1.02)':dy>0?`translateY(-${Math.min(dy*.25,24)}px)`:'none',transition:out?'opacity 0.28s,transform 0.28s':'transform 0.1s',fontFamily:'var(--mf)'}},
    h('div',{style:{color:tc}},h(StatusBar,{battery,wp})),
    h('div',{style:{flex:'0 0 32px'}}),
    h('div',{style:{paddingLeft:'26px',marginBottom:'1px'}},h('div',{style:{fontSize:'16px',fontWeight:600,color:tc,letterSpacing:'0.1px'}},`${now.getMonth()+1}月${now.getDate()}日 ${days[now.getDay()]}`)),
    h('div',{style:{paddingLeft:'20px'}},h('div',{style:{fontSize:csz+'px',fontWeight:cw,color:tc,lineHeight:1,letterSpacing:'-4px',fontVariantNumeric:'tabular-nums'}},`${pad(now.getHours())}:${pad(now.getMinutes())}`)),
    h('div',{style:{flex:1}}),
    h('div',{style:{display:'flex',justifyContent:'center',padding:'0 0 50px'}},
      h('div',{style:{width:'148px',height:'44px',borderRadius:'22px',background:il?'rgba(0,0,0,0.11)':'rgba(255,255,255,0.14)',backdropFilter:'blur(32px) saturate(180%)',WebkitBackdropFilter:'blur(32px) saturate(180%)',border:`1px solid ${il?'rgba(0,0,0,0.1)':'rgba(255,255,255,0.26)'}`,display:'flex',alignItems:'center',justifyContent:'center',gap:'7px',boxShadow:'0 4px 20px rgba(0,0,0,0.12)'}},
        h('svg',{width:13,height:13,viewBox:'0 0 14 14',fill:'none'},h('path',{d:'M7 1a3 3 0 0 1 3 3v1H4V4a3 3 0 0 1 3-3zM3 6h8a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1zm4 2a1 1 0 1 0 0 2 1 1 0 0 0 0-2z',fill:tc,opacity:.82})),
        h('span',{style:{fontSize:'14px',fontWeight:500,color:tc,opacity:.85,letterSpacing:'0.2px'}},'上滑解锁')
      )
    )
  );
}

function AppIcon({app,onOpen,dock,s}){
  const [pr,setPr]=useState(false);
  const sz=dock?52:s?.iconSz==='large'?62:s?.iconSz==='small'?46:54;
  const isz=sz*.44;
  const go=useCallback(()=>{setPr(true);setTimeout(()=>{setPr(false);onOpen(app.id);},100);},[app.id,onOpen]);
  return h('div',{style:{display:'flex',flexDirection:'column',alignItems:'center',gap:'4px',cursor:'pointer',userSelect:'none',minWidth:0},
    onTouchStart:e=>{e.stopPropagation();setPr(true);},onTouchEnd:e=>{e.stopPropagation();go();},
    onMouseDown:e=>{e.stopPropagation();setPr(true);},onMouseUp:e=>{e.stopPropagation();go();},onMouseLeave:()=>setPr(false)},
    h('div',{style:{width:sz+'px',height:sz+'px',borderRadius:sz*.23+'px',background:'rgba(245,245,245,0.92)',display:'flex',alignItems:'center',justifyContent:'center',transform:pr?'scale(0.84)':'scale(1)',transition:'transform 0.1s cubic-bezier(0.34,1.8,0.64,1)',boxShadow:pr?'none':'0 1px 6px rgba(0,0,0,0.16)',flexShrink:0}},
      h('svg',{width:isz,height:isz,viewBox:'0 0 16 16',fill:'none',stroke:'#2c2c2c',strokeWidth:'1.1',strokeLinecap:'round',strokeLinejoin:'round'},h('path',{d:app.svg}))
    ),
    !dock&&(s?.showLbl!==false)&&h('span',{style:{fontSize:'10px',color:'var(--text)',fontWeight:400,textAlign:'center',width:'60px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',opacity:.88,fontFamily:'var(--mf)'}},app.name)
  );
}

function Widget(){
  const [now,setNow]=useState(new Date());
  useEffect(()=>{const t=setInterval(()=>setNow(new Date()),30000);return()=>clearInterval(t);},[]);
  const days=['日','一','二','三','四','五','六'];
  return h('div',{style:{gridColumn:'span 4',background:'rgba(255,255,255,0.08)',border:'1px solid rgba(255,255,255,0.1)',borderRadius:'18px',padding:'14px 16px',backdropFilter:'blur(16px)',WebkitBackdropFilter:'blur(16px)',display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'4px'}},
    h('div',null,
      h('div',{style:{fontSize:'11px',color:'var(--text3)',marginBottom:'3px',fontFamily:'var(--mf)'}},'今天'),
      h('div',{style:{fontSize:'28px',fontWeight:700,color:'var(--text)',letterSpacing:'-1px',lineHeight:1,fontFamily:'var(--mf)'}},now.getDate()),
      h('div',{style:{fontSize:'12px',color:'var(--text2)',marginTop:'2px',fontFamily:'var(--mf)'}},`周${days[now.getDay()]}`)
    ),
    h('div',{style:{textAlign:'right'}},
      h('div',{style:{fontSize:'13px',fontWeight:600,color:'var(--text)',fontFamily:'var(--mf)'}},'萌萌机'),
      h('div',{style:{fontSize:'11px',color:'var(--text3)',marginTop:'3px',fontFamily:'var(--mf)'}},'V0.1 · 开发中'),
      h('div',{style:{fontSize:'11px',color:'var(--text3)',marginTop:'2px',fontFamily:'var(--mf)'}},'更多功能即将上线')
    )
  );
}

function HomeGrid({onOpen,s}){
  const pages=[P1,P2];
  const [pg,setPg]=useState(0);
  const [dx,setDx]=useState(0);
  const [drag,setDrag]=useState(false);
  const sx=useRef(0),sy=useRef(0),lk=useRef(null);
  const W=useRef(Math.min(window.innerWidth,390));
  const go=p=>{setPg(Math.max(0,Math.min(1,p)));setDx(0);setDrag(false);};
  const onTS=useCallback(e=>{sx.current=e.touches[0].clientX;sy.current=e.touches[0].clientY;lk.current=null;setDrag(true);},[]);
  const onTM=useCallback(e=>{
    if(!drag)return;
    const ddx=e.touches[0].clientX-sx.current,da=Math.abs(ddx),db=Math.abs(e.touches[0].clientY-sy.current);
    if(!lk.current){if(da>5||db>5)lk.current=da>db?'h':'v';}
    if(lk.current==='h'){e.preventDefault();let c=ddx;if(pg===0&&ddx>0)c=ddx*.12;if(pg===1&&ddx<0)c=ddx*.12;setDx(c);}
  },[drag,pg]);
  const onTE=useCallback(()=>{
    if(lk.current==='h'){if(dx<-50)go(pg+1);else if(dx>50)go(pg-1);else{setDx(0);setDrag(false);}}
    else{setDx(0);setDrag(false);}lk.current=null;
  },[dx,pg]);
  return h('div',{style:{flex:1,overflow:'hidden',position:'relative',touchAction:'pan-y'},onTouchStart:onTS,onTouchMove:onTM,onTouchEnd:onTE},
    h('div',{style:{display:'flex',width:'200%',height:'100%',transform:`translateX(${(-pg*W.current)+dx}px)`,transition:!drag?'transform 0.26s cubic-bezier(0.25,0.46,0.45,0.94)':'none',willChange:'transform'}},
      h('div',{style:{width:W.current+'px',flexShrink:0,display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:'18px 4px',padding:'14px 12px 8px',alignContent:'start'}},
        ...P1.map(app=>h('div',{key:app.id,style:{display:'flex',justifyContent:'center'}},h(AppIcon,{app,onOpen,s})))
      ),
      h('div',{style:{width:W.current+'px',flexShrink:0,padding:'14px 12px 8px',display:'flex',flexDirection:'column',gap:'0'}},
        h(Widget),
        h('div',{style:{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:'18px 4px'}},
          ...P2.map(app=>h('div',{key:app.id,style:{display:'flex',justifyContent:'center'}},h(AppIcon,{app,onOpen,s})))
        )
      )
    ),
    h('div',{style:{position:'absolute',bottom:'10px',left:0,right:0,display:'flex',justifyContent:'center',gap:'5px',pointerEvents:'none'}},
      ...[0,1].map(i=>h('div',{key:i,style:{width:i===pg?'16px':'5px',height:'5px',borderRadius:'3px',background:i===pg?'var(--text)':'var(--text3)',transition:'width 0.2s'}}))
    )
  );
}

function Dock({onOpen,s}){
  const apps=DOCK_IDS.map(id=>APPS.find(a=>a.id===id)).filter(Boolean);
  const bg=s.dockSt==='solid'?'var(--bg2)':s.dockSt==='none'?'transparent':'var(--dock)';
  const bf=s.dockSt==='glass'?'blur(28px)':'none';
  return h('div',{style:{padding:'0 14px 14px',flexShrink:0}},
    h('div',{style:{background:bg,backdropFilter:bf,WebkitBackdropFilter:bf,borderRadius:'26px',border:s.dockSt==='none'?'none':'1px solid var(--border2)',padding:'10px 10px',display:'flex',justifyContent:'space-around',alignItems:'center'}},
      ...apps.map(a=>h(AppIcon,{key:a.id,app:a,onOpen,dock:true,s}))
    )
  );
}

function HomeScreen({battery,onOpen,visible,wp,s}){
  return h('div',{style:{position:'absolute',inset:0,display:'flex',flexDirection:'column',opacity:visible?1:0,transform:visible?'scale(1)':'scale(1.04)',transition:'opacity 0.26s,transform 0.26s',pointerEvents:visible?'auto':'none',background:wp?.css||'var(--bg)'}},
    h(StatusBar,{battery,wp}),
    h(HomeGrid,{onOpen,s}),
    h(Dock,{onOpen,s})
  );
}

function Toggle({v,on}){

}

function PersonalPg({s,upd,onBack}){
  const [msg,setMsg]=useState('');const [ld,setLd]=useState(false);const fr=useRef();
  const hf=async e=>{
    const f=e.target.files?.[0];if(!f)return;setLd(true);setMsg('');
    try{const db=await getFDB();await dbSet(db,'font',await f.arrayBuffer());const ok=await applyFont();if(ok){upd({hasFont:true});setMsg('字体已应用 ✓');}else setMsg('加载失败');}
    catch{setMsg('导入出错');}setLd(false);
  };
  const clr=async()=>{const db=await getFDB();await dbDel(db,'font');document.documentElement.style.removeProperty('--mf');upd({hasFont:false});setMsg('已恢复默认');};
  return h('div',{style:{display:'flex',flexDirection:'column',height:'100%',background:'var(--bg)'}},
    h(SubHdr,{title:'个性化',onBack}),
    h('div',{style:{flex:1,overflowY:'auto',padding:'10px 16px 20px'}},
      h(Sec,{title:'字体'},h('div',{style:{padding:'12px 16px',display:'flex',flexDirection:'column',gap:'10px'}},
        h('div',{style:{fontSize:'13px',color:'var(--text2)',fontFamily:'var(--mf)'}},s.hasFont?'已使用自定义字体':'支持 .ttf / .otf，导入后全局生效'),
        h('div',{style:{display:'flex',gap:'8px'}},
          h('div',{onClick:()=>fr.current?.click(),style:{flex:1,padding:'9px',borderRadius:'10px',border:'1.5px dashed var(--border2)',textAlign:'center',cursor:'pointer',color:'var(--text2)',fontSize:'14px',fontFamily:'var(--mf)'}},ld?'导入中...':'导入字体文件'),
          s.hasFont&&h('div',{onClick:clr,style:{padding:'9px 12px',borderRadius:'10px',border:'1.5px solid var(--border2)',cursor:'pointer',color:'var(--text3)',fontSize:'14px',fontFamily:'var(--mf)'}},'恢复默认')
        ),
        msg&&h('div',{style:{fontSize:'12px',color:msg.includes('✓')?'#34c759':'var(--text3)',fontFamily:'var(--mf)'}},msg),
        h('input',{ref:fr,type:'file',accept:'.ttf,.otf,.woff,.woff2',style:{display:'none'},onChange:hf})
      )),
      h(Sec,{title:'图标'},h('div',{style:{padding:'12px 16px',display:'flex',flexDirection:'column',gap:'12px'}},
        h('div',null,h('div',{style:{fontSize:'13px',color:'var(--text2)',marginBottom:'8px',fontFamily:'var(--mf)'}},'大小'),h(Seg,{opts:[{id:'small',l:'小'},{id:'normal',l:'标准'},{id:'large',l:'大'}],val:s.iconSz,onV:v=>upd({iconSz:v})})),
        h(SRow,{label:'显示图标名称',toggle:true,tv:s.showLbl,onT:v=>upd({showLbl:v}),last:true,ch:false})
      )),
      h(Sec,{title:'Dock'},h('div',{style:{padding:'12px 16px'}},h(Seg,{opts:[{id:'glass',l:'毛玻璃'},{id:'solid',l:'纯色'},{id:'none',l:'透明'}],val:s.dockSt,onV:v=>upd({dockSt:v})}))),
      h(Sec,{title:'锁屏时钟'},h('div',{style:{padding:'12px 16px',display:'flex',flexDirection:'column',gap:'12px'}},
        h('div',null,h('div',{style:{fontSize:'13px',color:'var(--text2)',marginBottom:'8px',fontFamily:'var(--mf)'}},'字重'),h(Seg,{opts:[{id:'thin',l:'细体'},{id:'medium',l:'中等'},{id:'bold',l:'粗体'}],val:s.ckW,onV:v=>upd({ckW:v})})),
        h('div',null,h('div',{style:{fontSize:'13px',color:'var(--text2)',marginBottom:'8px',fontFamily:'var(--mf)'}},'大小'),h(Seg,{opts:[{id:'small',l:'小'},{id:'medium',l:'中'},{id:'large',l:'大'}],val:s.ckSz,onV:v=>upd({ckSz:v})}))
      ))
    )
  );
}

function SettingsApp({s,upd}){
  const [sub,setSub]=useState(null);
  if(sub==='wp')return h(WPPage,{s,upd,onBack:()=>setSub(null)});
  if(sub==='theme')return h(ThemePg,{cur:s.theme,onSel:t=>{upd({theme:t});setSub(null);},onBack:()=>setSub(null)});
  if(sub==='personal')return h(PersonalPg,{s,upd,onBack:()=>setSub(null)});
  if(sub==='chatBeauty')return h(ChatBeauty,{s,upd,onBack:()=>setSub(null)});
  if(sub==='api')return h(APIPage,{s,upd,onBack:()=>setSub(null)});
  if(sub==='about')return h('div',{style:{display:'flex',flexDirection:'column',height:'100%',background:'var(--bg)'}},
    h(SubHdr,{title:'关于',onBack:()=>setSub(null)}),
    h('div',{style:{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:'18px',padding:'32px'}},
      h('div',{style:{fontSize:'52px'}},'📱'),
      h('div',{style:{fontSize:'22px',fontWeight:700,color:'var(--text)',fontFamily:'var(--mf)'}},'萌萌机'),
      h(Sc,{style:{width:'100%'}},...[['版本','V0.1'],['阶段','开发中'],['作者','rainj5435-wq'],['框架','React 18']].map(([k,v],i,arr)=>h('div',{key:k,style:{display:'flex',justifyContent:'space-between',padding:'11px 16px',borderBottom:i<arr.length-1?'1px solid var(--div)':'none',fontFamily:'var(--mf)'}},h('span',{style:{color:'var(--text3)',fontSize:'14px'}},k),h('span',{style:{color:'var(--text)',fontSize:'14px',fontWeight:500}},v)))),
      h('div',{style:{color:'var(--text3)',fontSize:'12px',textAlign:'center',lineHeight:1.8,fontFamily:'var(--mf)'}},'你的 AI 小手机\n更多功能持续开发中')
    )
  );
  const tl={dark:'深色',light:'浅色',auto:'跟随系统'}[s.theme];
  const wl=s.cwp?'自定义':(WPS[s.wp]?.name||'默认');
  return h('div',{style:{display:'flex',flexDirection:'column',height:'100%',background:'var(--bg)',fontFamily:'var(--mf)'}},
    h('div',{style:{padding:'18px 20px 10px',flexShrink:0,borderBottom:'1px solid var(--div)'}},h('h1',{style:{fontSize:'22px',fontWeight:700,color:'var(--text)',letterSpacing:'-0.5px',margin:0,fontFamily:'var(--mf)'}},'设置')),
    h('div',{style:{flex:1,overflowY:'auto',padding:'8px 16px 20px'}},
      h(Sec,{title:'外观'},h(SRow,{icon:'🌓',color:'#444',label:'外观',value:tl,onPress:()=>setSub('theme')}),h(SRow,{icon:'🖼️',color:'#3a3a3a',label:'壁纸',value:wl,onPress:()=>setSub('wp')}),h(SRow,{icon:'✨',color:'#333',label:'个性化',value:'字体·图标·时钟',onPress:()=>setSub('personal'),last:true})),
      h(Sec,{title:'AI'},h(SRow,{icon:'🤖',color:'#2a2a2a',label:'AI API',value:s.apis?.length?s.apis.length+'个':'未配置',onPress:()=>setSub('api'),last:true})),
      h(Sec,{title:'聊天'},h(SRow,{icon:'💬',color:'#3a3a3a',label:'聊天美化',value:'背景·气泡·头像',onPress:()=>setSub('chatBeauty'),last:true})),
      h(Sec,{title:'通知与声音'},h(SRow,{icon:'🔔',color:'#3a3a3a',label:'通知',toggle:true,tv:s.notif,onT:v=>upd({notif:v})}),h(SRow,{icon:'🔊',color:'#333',label:'声音',toggle:true,tv:s.sound,onT:v=>upd({sound:v})}),h(SRow,{icon:'🌙',color:'#2a2a2a',label:'勿扰',toggle:true,tv:s.dnd,onT:v=>upd({dnd:v}),last:true})),
      h(Sec,{title:'其他'},h(SRow,{icon:'ℹ️',color:'#383838',label:'关于萌萌机',value:'V0.1',onPress:()=>setSub('about'),last:true}))
    )
  );
}

function Soon({app}){
  return h('div',{style:{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',height:'100%',gap:'12px',padding:'40px',background:'var(--bg)',fontFamily:'var(--mf)'}},
    h('div',{style:{width:'66px',height:'66px',borderRadius:'20px',background:'rgba(245,245,245,0.92)',display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'0 4px 16px var(--shad)'}},h('svg',{width:30,height:30,viewBox:'0 0 16 16',fill:'none',stroke:'#2a2a2a',strokeWidth:'1.1',strokeLinecap:'round',strokeLinejoin:'round'},h('path',{d:app.svg}))),
    h('div',{style:{fontSize:'19px',fontWeight:600,color:'var(--text)',letterSpacing:'-0.3px'}},app.name),
    h('div',{style:{background:'var(--card)',border:'1px solid var(--border)',borderRadius:'12px',padding:'11px 20px',color:'var(--text3)',fontSize:'14px',textAlign:'center'}},'此 App 即将开放')
  );
}

function AppWin({app,battery,s,upd,onClose}){
  const [vis,setVis]=useState(false);const [mnt,setMnt]=useState(false);
  useEffect(()=>{if(app){setMnt(true);const t=setTimeout(()=>setVis(true),10);return()=>clearTimeout(t);}},[app]);
  const close=()=>{setVis(false);setTimeout(()=>{setMnt(false);onClose();},250);};
  if(!mnt)return null;
  const wp=s.cwp?{css:`url(${s.cwp}) center/cover`,light:false}:(WPS[s.wp]||WPS[0]);
  const getC=()=>{if(!app)return null;if(app.id==='settings')return h(SettingsApp,{s,upd});if(app.id==='chat')return h(ChatApp,{s,onUpdate:upd});return h(Soon,{app});};
  return h('div',{style:{position:'absolute',inset:0,display:'flex',flexDirection:'column',transform:vis?'scale(1)':'scale(0.95)',opacity:vis?1:0,transformOrigin:'center bottom',transition:'transform 0.24s cubic-bezier(0.34,1.1,0.64,1),opacity 0.2s',overflow:'hidden',borderRadius:'inherit',background:'var(--bg)',fontFamily:'var(--mf)'}},
    h('div',{style:{flexShrink:0,background:'var(--hbg)',backdropFilter:'blur(20px)',WebkitBackdropFilter:'blur(20px)',borderBottom:'1px solid var(--div)'}},
      h(StatusBar,{battery,wp}),
      h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'2px 16px 10px'}},
        h('span',{style:{fontSize:'17px',fontWeight:600,color:'var(--text)',letterSpacing:'-0.3px',fontFamily:'var(--mf)'}},app?.name),
        h('button',{onClick:close,style:{background:'var(--card2)',border:'1px solid var(--border)',borderRadius:'50%',width:'26px',height:'26px',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',color:'var(--text3)',fontSize:'12px',flexShrink:0}},'✕')
      )
    ),
    h('div',{style:{flex:1,overflow:'hidden',position:'relative'}},getC()),
    h('div',{style:{padding:'7px 0 5px',display:'flex',justifyContent:'center',flexShrink:0,background:'var(--hbg)'}},h('div',{onClick:close,style:{width:'100px',height:'4px',background:'var(--text3)',borderRadius:'2px',cursor:'pointer'}}))
  );
}

function PhoneShell(){
  const [s,setS]=useState(getS);
  const [scr,setScr]=useState('lock');
  const [aid,setAid]=useState(null);
  const [hv,setHv]=useState(false);
  const battery=82;
  const upd=useCallback(patch=>setS(prev=>{const n={...prev,...patch};LS.s(n);applyTheme(n.theme);return n;}),[]);
  useEffect(()=>{applyTheme(s.theme);if(s.hasFont)applyFont();},[]);
  useEffect(()=>{applyTheme(s.theme);},[s.theme]);
  const wp=useMemo(()=>s.cwp?{css:`url(${s.cwp}) center/cover no-repeat`,light:false}:(WPS[s.wp]||WPS[0]),[s.wp,s.cwp]);
  const unlock=useCallback(()=>{setScr('home');setTimeout(()=>setHv(true),10);},[]);
  const open=useCallback(id=>{setAid(id);setScr('app');},[]);
  const close=useCallback(()=>{setAid(null);setScr('home');},[]);
  const app=aid?APPS.find(a=>a.id===aid)||null:null;
  return h('div',{style:{width:'100%',height:'100%',position:'relative',borderRadius:'inherit',overflow:'hidden'}},
    scr==='lock'&&h('div',{style:{position:'absolute',inset:0,zIndex:10}},h(LockScreen,{battery,wp,s,onUnlock:unlock})),
    scr!=='lock'&&h('div',{style:{position:'absolute',inset:0,zIndex:1}},h(HomeScreen,{battery,onOpen:open,visible:scr==='home'&&hv,wp,s})),
    (scr==='app'||aid)&&h('div',{style:{position:'absolute',inset:0,zIndex:5}},h(AppWin,{app,battery,s,upd,onClose:close}))
  );
}

function App(){
  useEffect(()=>{applyTheme(getS().theme);},[]);
  return h('div',{style:{minHeight:'100dvh',display:'flex',alignItems:'center',justifyContent:'center',background:'#000'}},h('div',{className:'po'},h(PhoneShell)));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
